services:
  # ==========================================
  # PostgreSQL
  # ==========================================
  postgres:
    image: postgres:18-alpine
    container_name: 360-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-phone_shop_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 360-phone-shop-service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-phone_shop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # RustFS / S3 Storage
  # ==========================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: 360-rustfs
    restart: always
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-admin@123}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-false}"
    volumes:
      - rustfs_data:/data
    command:
      - /data
    networks:
      - 360-phone-shop-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Spring Boot Backend
  # ==========================================
  360-phone-shop-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: 360-phone-shop-service:latest
    container_name: 360-phone-shop-container-service
    restart: always
    ports:
      - "${SERVER_PORT:-3333}:3333"
    environment:
      SERVER_PORT: 3333
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-phone_shop_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-admin@123}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-sarana}
      RUSTFS_BUCKETS: ${RUSTFS_BUCKETS:-sarana,product,store,users,category,brand,model}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      REDIS_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3OD=}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173,http://localhost:3000,http://169.58.63.127,http://169.58.63.127:8080,http://169.58.63.127:8097,https://360-system.vercel.app}
      # FLYWAY_VALIDATE_ON_MIGRATE: "false"
      APP_SEEDER_ENABLED: ${APP_SEEDER_ENABLED:-true}
      APP_SEEDER_FORCE: ${APP_SEEDER_FORCE:-false}
    networks:
      - 360-phone-shop-service
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    name: 360_phone_shop_postgres_data
  rustfs_data:
    name: 360_phone_shop_rustfs_data

# ==========================================
# Network
# ==========================================
networks:
  360-phone-shop-service:
    name: 360-phone-shop-service
