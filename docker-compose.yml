
services:

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: 360-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-db_360ff}

    ports:
      # Localhost only. Backend uses internal port 5432.
      - "127.0.0.1:${POSTGRES_PORT:-54332}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - 360-phone-shop-service

    healthcheck:
      test:
        - "CMD-SHELL"
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ==========================================
  # RustFS S3 Object Storage
  # ==========================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: 360-rustfs
    restart: unless-stopped

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-admin@123}
      RUSTFS_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ADDRESS: ":9111"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOGGER_LEVEL: error

    command:
      - /data

    volumes:
      - rustfs_data:/data

    # Keep storage and console private.
    # Backend accesses RustFS through rustfs:9001.
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9001}:9001"
      - "127.0.0.1:9111:9111"

    networks:
      - 360-phone-shop-service

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ==========================================
  # Spring Boot Backend
  # ==========================================
  360-phone-shop-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: 360-phone-shop-service:latest
    container_name: 360-phone-shop-container-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 3333
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-db_360ff}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}

      # RustFS
      RUSTFS_ENDPOINT: http://rustfs:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-admin@123}
      RUSTFS_BUCKET: sarana
      RUSTFS_BUCKETS: sarana,product,store,users,category,brand,model
      AWS_REGION: us-east-1

      # Email configuration
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${MAIL_USERNAME:-admin}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-admin@123}

      # Application configuration
      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-http://169.58.63.127:8080/reset-password}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-ZGV2LWp3dC1zZWNyZXQtZm9yLWxvY2FsLWRldmVsb3BtZW50LXVzZS1vbmx5LTEyMzQ1Njc4}

      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173,http://localhost:8080,http://169.58.63.127:8080}

      # Default user seeder
      APP_SEEDER_ENABLED: ${APP_SEEDER_ENABLED:-true}
      APP_SEEDER_FORCE: ${APP_SEEDER_FORCE:-false}
      APP_SEEDER_DEFAULT_USER_PASSWORD: ${APP_SEEDER_DEFAULT_USER_PASSWORD:-admin@123}

    ports:
      - "${SERVER_PORT:-3333}:3333"

    networks:
      - 360-phone-shop-service

    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  postgres_data:
    name: 360_phone_shop_postgres_data

  rustfs_data:
    name: 360_phone_shop_rustfs_data

  # redis_data:
  #   name: 360_phone_shop_redis_data


# ==========================================
# Docker Network
# ==========================================
networks:
  360-phone-shop-service:
    name: 360-phone-shop-service
    driver: bridge
