spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sarana-resturant-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend_360s}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
#  flyway:
#    enabled: ${FLYWAY_ENABLED:update}
#    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
#    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
#    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Phnom_Penh
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: ${SHOW_SQL:false}

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:admin@123}
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: none

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:namyou854@gmail.com}
    password: ${MAIL_PASSWORD:zfexkdflnztzzypw}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  tomcat:
    max-http-form-post-size: 104857600
    max-swallow-size: 104857600
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true

rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
  access-key: ${RUSTFS_ACCESS_KEY:admin}
  secret-key: ${RUSTFS_SECRET_KEY:admin@123}
  bucket: ${RUSTFS_BUCKET:sarana}

app:
  jwt:
    secret: ${JWT_SECRET_BASE64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3OD=}
    access-expiration-seconds: 900
    refresh-expiration-seconds: 86400
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
  mail-from: ${MAIL_FROM:noreply@sarana.com}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
