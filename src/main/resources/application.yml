spring:
  application:
    name: sarana-resturant-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_360}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    # validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Phnom_Penh
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: ${SHOW_SQL:false}

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:admin123}
      timeout: 6000ms

server:
  tomcat:
    max-http-form-post-size: 104857600
    max-swallow-size: 104857600
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
# server:
#   port: ${MANAGEMENT_SERVER_PORT:8082}

springdoc:
  api-docs:
    enabled: true

rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
  access-key: ${RUSTFS_ACCESS_KEY:admin}
  secret-key: ${RUSTFS_SECRET_KEY:admin@123}
#  bucket: ${RUSTFS_BUCKET:sarana}
  buckets: ${RUSTFS_BUCKETS:sarana,product,store,users,category,brand,model}

app:
  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}
    force: ${APP_SEEDER_FORCE:false}
    default-user-password: ${APP_SEEDER_DEFAULT_USER_PASSWORD:admin@123}
  jwt:
    secret: ${JWT_SECRET_BASE64:ZGV2LWp3dC1zZWNyZXQtZm9yLWxvY2FsLWRldmVsb3BtZW50LXVzZS1vbmx5LTEyMzQ1Njc4}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:86400}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:5173/reset-password}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}
