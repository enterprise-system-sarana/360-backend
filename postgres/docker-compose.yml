
services:
  postgres:
    image: postgres:17-alpine
    container_name: 360-postgres
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db_360

    volumes:
      - postgres_data:/var/lib/postgresql/data

#    networks:
#      - 360-phone-shop-service

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

#networks:
#  360-phone-shop-service:
#    name: 360-phone-shop-service

volumes:
  postgres_data:
