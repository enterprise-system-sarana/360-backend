version: '3.9'
services:
  postgres:
    image: postgres:17-alpine
    restart: always
    container_name: 360-service
    ports:
      - "${POSTGRES_PORT:-54340}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - 360-phone-shop-service

networks:
  360-phone-shop-service:
    name: 360-phone-shop-service