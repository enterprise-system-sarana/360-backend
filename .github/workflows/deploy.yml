name: Build and deploy spring API

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  IMAGE_NAME: 360-phone-shop-service:latest
  DEPLOY_PATH: /opt/360-backend

jobs:
  build-deploy:
    name: Build and deploy spring API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Export Docker image
        run: docker save --output image.tar "${{ env.IMAGE_NAME }}"

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 169.58.63.127
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: mkdir -p "${{ env.DEPLOY_PATH }}"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 169.58.63.127
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "docker-compose.yml,image.tar"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Restart application on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 169.58.63.127
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script_stop: true
          script: |
            set -e
            mkdir -p "${{ env.DEPLOY_PATH }}"
            cd "${{ env.DEPLOY_PATH }}"
            docker load --input image.tar
            docker compose up -d --no-build
            rm -f image.tar
            docker image prune -f
